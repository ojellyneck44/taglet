<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared music · Taglet</title>
<meta name="description" content="Music shared with Taglet. Play it here, or download it tagged and ready for Spotify.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Music shared with Taglet">
<meta property="og:description" content="Play it in your browser, or download it tagged and ready for Spotify.">
<meta property="og:image" content="https://taglet.net/og.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/base.css">
<style>
  .ambient { position: fixed; inset: -20%; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .9s var(--ease-out); }
  .ambient.on { opacity: .4; }
  .ambient img { width: 100%; height: 100%; object-fit: cover; filter: blur(90px) saturate(1.4); }
  .ambient::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 40%, transparent, var(--ink-0) 85%); }
  .shared { max-width: 980px; margin: 0 auto; padding: calc(100px + env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right)) var(--s8) max(var(--s4), env(safe-area-inset-left));
    display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--s7); align-items: start; }
  .cover { aspect-ratio: 1; border-radius: 6px; background: var(--ink-2); overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.75), 0 0 0 1px var(--line); position: sticky; top: 96px; display: grid; place-items: center; color: var(--paper-3); }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover svg { width: 40px; height: 40px; }
  .kind { font-size: var(--t-sm); color: var(--paper-2); }
  .shared h1 { font-size: var(--t-3xl); letter-spacing: -0.035em; margin-top: var(--s2); }
  .by { margin-top: var(--s2); font-size: var(--t-lg); color: var(--paper); }
  .facts { margin-top: var(--s2); font-size: var(--t-sm); color: var(--paper-3); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s5); }
  .list { list-style: none; padding: 0; margin: var(--s6) 0 0; }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 44px; align-items: center; gap: var(--s2); min-height: 60px; padding-right: var(--s1); border-radius: 10px; position: relative;
    background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 30%, transparent) var(--play, 0%), transparent var(--play, 0%)); }
  .row + .row::before { content: ""; position: absolute; left: 52px; right: 8px; top: 0; border-top: 1px solid var(--line); }
  .row.on { background-color: var(--accent-soft); }
  .row.on::before, .row.on + .row::before { display: none; }
  .play, .dl { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--paper-2); cursor: pointer; }
  .play:hover, .dl:hover { background: rgba(243,236,226,.08); color: var(--paper); }
  .row.on .play { color: var(--accent); }
  .play svg, .dl svg { width: 20px; height: 20px; }
  .row strong { display: block; font-weight: 600; font-size: var(--t-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row small { display: block; font-size: var(--t-xs); color: var(--paper-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dur { font: 500 var(--t-xs) var(--font-mono); color: var(--paper-2); font-variant-numeric: tabular-nums; }
  .note { margin-top: var(--s6); font-size: var(--t-sm); color: var(--paper-3); max-width: 56ch; }
  .state { grid-column: 1 / -1; text-align: center; padding: var(--s8) 0; }
  .state h1 { font-size: var(--t-2xl); }
  .state p { margin: var(--s3) auto 0; color: var(--paper-2); max-width: 44ch; }
  .state .btn { margin-top: var(--s5); }
  .progress { font-size: var(--t-sm); color: var(--paper-2); }
  @media (max-width: 760px) {
    .shared { grid-template-columns: 1fr; gap: var(--s5); padding-top: calc(84px + env(safe-area-inset-top)); }
    .cover { position: static; width: min(300px, 80%); margin: 0 auto; }
    .info { text-align: center; }
    .list { text-align: left; }
    .actions { justify-content: center; }
    .actions .btn { flex: 1 1 100%; }
    .shared h1 { font-size: var(--t-2xl); }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the music</a>
<div class="ambient" aria-hidden="true"><img id="ambient" alt="" hidden></div>
<header class="doc-bar glass">
  <a class="wordmark" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-mark"/></svg><span>taglet</span></a>
  <a class="btn primary small" href="/">Open Taglet</a>
</header>
<main class="shared" id="main">
  <div class="state" id="state"><p class="progress" role="status">Opening the link…</p></div>
</main>
<footer class="site-foot">
  <a href="/spotify/">Adding files to Spotify</a><a href="/privacy/">Privacy</a><span>Shared with Taglet</span>
</footer>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mark" viewBox="0 0 32 32"><path d="M12.2 3.5h7.6c1.2 0 2.2 1 2.2 2.2v4l4.4 5.4c.4.5.6 1.1.6 1.7v9.5c0 1.6-1.3 2.9-2.9 2.9H7.9C6.3 29.2 5 27.9 5 26.3v-9.5c0-.6.2-1.2.6-1.7L10 9.7v-4c0-1.2 1-2.2 2.2-2.2Z" fill="currentColor" transform="rotate(-14 16 16)"/><circle cx="16" cy="13" r="2.3" fill="#0b0a09" transform="rotate(-14 16 16)"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.8v12.4c0 .7.8 1.1 1.4.7l9.4-6.2c.5-.4.5-1.1 0-1.5L9.4 5c-.6-.4-1.4 0-1.4.8Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="7" y="5.5" width="3.6" height="13" rx="1"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1"/></g></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 15.5v2.7c0 1.2 1 2.3 2.3 2.3h10.4c1.3 0 2.3-1.1 2.3-2.3v-2.7"/></g></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><circle cx="9" cy="9" r="1.7"/><path d="m20.5 15.5-4.8-4.8L6 20.5"/></g></symbol>
  </defs>
</svg>
<audio id="player" preload="none"></audio>
<script src="/js/doc.js"></script>
<script type="module" src="/js/share.js"></script>
</body>
</html>
