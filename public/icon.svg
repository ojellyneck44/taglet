<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#2a2520"/>
      <stop offset="0.6" stop-color="#141210"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74d8c9"/>
      <stop offset="1" stop-color="#3cb4a3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-14 256 300)">
    <!-- paper tag with clipped shoulders -->
    <path d="M196 118 H316 Q334 118 344 132 L392 196 Q400 207 400 220 V412 Q400 440 372 440 H140 Q112 440 112 412 V220 Q112 207 120 196 L168 132 Q178 118 196 118 Z" fill="url(#tag)"/>
    <!-- eyelet: a ring with the background showing through -->
    <circle cx="256" cy="176" r="27" fill="#2b8b7e"/>
    <circle cx="256" cy="176" r="17" fill="#0e0c0a"/>
    <!-- three written lines, the first one bold: title, artists, album -->
    <rect x="158" y="300" width="160" height="22" rx="11" fill="#04201b"/>
    <rect x="158" y="344" width="196" height="11" rx="5.5" fill="#04201b" opacity="0.45"/>
    <rect x="158" y="378" width="120" height="11" rx="5.5" fill="#04201b" opacity="0.45"/>
  </g>
  <!-- the string runs into the eyelet -->
  <path d="M268 -10 C 262 62, 238 118, 227 176" fill="none" stroke="#bdb4a7" stroke-width="7" stroke-linecap="round"/>
</svg>
