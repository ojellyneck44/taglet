name = "taglet"
main = "src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
# Email codes stay hidden until taglet.net is verified for sending; set to "on" (or remove) and deploy.
EMAIL_SENDING = "off"

routes = [
  { pattern = "taglet.net", custom_domain = true },
  { pattern = "www.taglet.net", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"
# Only /api/ runs code; every other request is a plain static file.
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Quota"]

# Shared albums and singles: encrypted on the sender's device, kept for 30 days.
[[kv_namespaces]]
binding = "SHARES"
id = "c5f53ef5266443ed9a7077a650e73892"

# Accounts: users, sessions and each person's synced library (no audio).
# Sign-in options turn on when their secrets are set (npx wrangler secret put NAME):
#   RESEND_API_KEY (+ optional EMAIL_FROM) for email codes; GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET;
#   GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET; APPLE_CLIENT_ID + APPLE_TEAM_ID + APPLE_KEY_ID + APPLE_PRIVATE_KEY.
[[d1_databases]]
binding = "DB"
database_name = "taglet"
database_id = "15a331e3-ea97-4ec6-bef8-b06dd44c890c"
